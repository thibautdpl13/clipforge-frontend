<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipForge</title>
    <style>
        body {
            background-color: #030712;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .card {
            width: 100%;
            max-width: 28rem;
            background-color: #0f172a;
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid #1e293b;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #818cf8;
            letter-spacing: 0.05em;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            color: white;
            font-size: 0.875rem;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #6366f1;
        }
        input::placeholder {
            color: #64748b;
        }
        button {
            width: 100%;
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: #4f46e5;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4338ca;
        }
        button:disabled {
            background-color: #312e81;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .status {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            min-height: 2rem;
            line-height: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>ClipForge</h1>
        <form id="clipForm">
            <div>
                <label for="videoUrl">YouTube Video URL</label>
                <input 
                    type="url" 
                    id="videoUrl" 
                    required 
                    placeholder="https://www.youtube.com/watch?v=..."
                >
            </div>
            <button type="submit" id="generateBtn">Generate Clip</button>
        </form>
        <div id="statusMessage" class="status"></div>
    </div>

    <script>
        const form = document.getElementById('clipForm');
        const videoUrlInput = document.getElementById('videoUrl');
        const statusMessage = document.getElementById('statusMessage');
        const generateBtn = document.getElementById('generateBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = videoUrlInput.value.trim();
            if (!url) return;

            generateBtn.disabled = true;
            generateBtn.textContent = 'Processing...';
            statusMessage.textContent = 'Connecting to backend (Render may take up to 45s to wake up on first request)...';

            try {
                const response = await fetch('https://clipforge-backend-4t73.onrender.com/generate-auto-clip', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: url })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.detail || `Server error: ${response.status}`);
                }

                statusMessage.textContent = 'Download starting...';
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = 'clip.mp4';
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                statusMessage.textContent = 'Clip generated and downloaded successfully!';
            } catch (err) {
                statusMessage.textContent = `Error: ${err.message}`;
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Clip';
            }
        });
    </script>
</body>
</html>
