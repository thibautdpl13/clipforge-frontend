<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipForge</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 p-6 rounded-xl shadow-lg border border-slate-800">
        <h1 class="text-2xl font-bold mb-6 text-center tracking-wide text-indigo-400">ClipForge</h1>
        
        <form id="clipForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-2 text-slate-300">YouTube Video URL</label>
                <input 
                    type="url" 
                    id="videoUrl" 
                    required 
                    placeholder="https://www.youtube.com/watch?v=..." 
                    class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500 text-sm"
                >
            </div>
            <button 
                type="submit" 
                id="generateBtn" 
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-lg transition duration-200 text-sm shadow-md"
            >
                Generate Clip
            </button>
        </form>

        <div id="statusMessage" class="mt-4 text-center text-xs text-slate-400 leading-relaxed min-h-[2rem]"></div>
    </div>

    <script>
        const form = document.getElementById('clipForm');
        const videoUrlInput = document.getElementById('videoUrl');
        const statusMessage = document.getElementById('statusMessage');
        const generateBtn = document.getElementById('generateBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Completely prevents page reloads and scrolling jumps
            
            const url = videoUrlInput.value.trim();
            if (!url) return;

            generateBtn.disabled = true;
            generateBtn.textContent = 'Processing...';
            statusMessage.textContent = 'Connecting to backend (Render may take up to 45s to wake up on first request)...';

            try {
                const response = await fetch('https://clipforge-backend-4t73.onrender.com/generate-auto-clip', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: url })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.detail || `Server error: ${response.status}`);
                }

                statusMessage.textContent = 'Download starting...';
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = 'clip.mp4';
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                statusMessage.textContent = 'Clip generated and downloaded successfully!';
            } catch (err) {
                statusMessage.textContent = `Error: ${err.message}`;
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Clip';
            }
        });
    </script>
</body>
</html>
